<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Webinar subscription v2</title>
    <link href="index.css" rel="stylesheet">
</head>
<body>
<main>
    <article>
        <form action="process.php" method="post">
            <header><h1>Webinar Subscription</h1></header>
            <section>
                <label for="name">Name</label>
                <div class="width-3col first-line">
                    <input type="text" name="Name" id="name">
                    <span>Name</span>
                </div>
                <div class="width-3col first-line">
                    <input type="text" name="Surname">
                    <span>Last name</span>
                </div>
            </section>

            <section>
                <label for="email">E-mail</label>
                <div class="width-5col first-line">
                    <input type="email" placeholder="ex: myname@example.com" name="Email" id="email">
                    <span>example@example.com</span>
                </div>
            </section>

            <section>
                <label for="Areacode">Work Phone</label>
                <div class="width-1col first-line">
                    <input type="text" name="Areacode" id="Areacode">
                    <span>Areacode</span>
                </div>
                <div class="center">-</div>
                <div class="width-3col first-line">
                    <input type="text" name="Phonenumber">
                    <span>Phone number</span>
                </div>
            </section>

            <section>
                <label for="company">Company</label>
                <input class="width-4col" type="text" name="company" id="company">
            </section>


            <section>
                <label for="StreetAddressLine1">Company address</label>
                <div class="width-6col first-line">
                    <input type="text" name="StreetAddressLine1" id="StreetAddressLine1">
                    <span>Street address </span>
                </div>
                <div class="new-line width-6col ">
                    <input type="text" name="StreetAddressLine2">
                    <span>Street address 2</span>
                </div>

                <div class="new-line width-3col">
                    <input type="text" name="city">
                    <span>City</span>
                </div>

                <div class="width-3col">
                    <input type="text" name="state">
                    <span>State / Province</span>
                </div>

                <div class="new-line width-2col">
                    <input type="text" name="zipcode">
                    <span>Postal / Zip Code</span>
                </div>
            </section>
            <section>
                <label for="website">Company Website</label>
                <div class="width-5col first-line">
                    <input type="text" name="website" id="website">

                </div>
            </section>
            <section>
                <div class="new-line ">
                    <button type="submit">Submit</button>
                </div>
            </section>
        </form>
    </article>
</main>
</body>
</html>
